id: NG-1
title: Create a Payment (Angular)
application: angular-fixture
release: 2026.08.26

start:
  url: http://localhost:3002/

steps:
  - id: amount
    target:
      label: Amount
    action: input
    value: "500"
    instruction: "Enter 500 into the amount field."

  - id: beneficiary
    target:
      text: "Beneficiary"
    action: click
    instruction: "Select the beneficiary."

  - id: submit
    target:
      role: button
      name: "Submit Payment"
    action: click
    instruction: "Submit the payment."

  - id: success
    target:
      text: "Payment successful"
    action: verify
    instruction: "Verify that the payment was successful."
