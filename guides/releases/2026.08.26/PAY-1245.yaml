id: PAY-1245
title: Create a Payment
application: demo-bank
release: 2026.08.26
extends: PAY-PAYMENT-SUBMISSION

start:
  url: http://localhost:3001/payments/new

steps:
  - id: amount
    target:
      label: Amount
    action: input
    value: "1000"
    before: submit
    instruction: "Enter 1000 into the amount field."

  - id: beneficiary
    target:
      text: "Beneficiary"
    action: click
    after: amount
    instruction: "Select the beneficiary."
