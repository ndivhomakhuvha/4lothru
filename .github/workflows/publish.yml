name: Publish 4lothru

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish 4lothru from the selected release commit
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm
    name: Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm typecheck
          pnpm test
          pnpm guides:validate
          pnpm build

      - name: Publish 4lothru
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is missing from the npm-publish GitHub environment."
            exit 1
          fi

          package_version="$(node -p "require('./packages/4lothru/package.json').version")"
          set +e
          registry_result="$(npm view "4lothru@${package_version}" version 2>&1)"
          registry_status=$?
          set -e

          if [ "$registry_status" -eq 0 ]; then
            echo "4lothru@${package_version} is already published; skipping."
          elif [[ "$registry_result" == *"E404"* || "$registry_result" == *"404 Not Found"* ]]; then
            pnpm --dir packages/4lothru publish --access public --no-git-checks
          else
            echo "$registry_result" >&2
            exit "$registry_status"
          fi
