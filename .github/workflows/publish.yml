name: Publish packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish every versioned package from the selected, tagged release commit
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm
    name: Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm typecheck
          pnpm test
          pnpm guides:validate
          pnpm build

      - name: Publish guide schema
        run: pnpm --filter @trail-cli/guide-schema publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI
        run: pnpm --filter @trail-cli/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK
        run: pnpm --filter @trail-cli/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
