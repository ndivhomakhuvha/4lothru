name: Publish packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish new package versions from the selected release commit
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm
    name: Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm typecheck
          pnpm test
          pnpm guides:validate
          pnpm build

      - name: Publish new package versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in packages/guide-schema packages/cli packages/sdk packages/4lothru; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            set +e
            registry_result="$(npm view "${package_name}@${package_version}" version 2>&1)"
            registry_status=$?
            set -e

            if [ "$registry_status" -eq 0 ]; then
              echo "${package_name}@${package_version} is already published; skipping."
            elif [[ "$registry_result" == *"E404"* || "$registry_result" == *"404 Not Found"* ]]; then
              pnpm --dir "$package_dir" publish --access public --no-git-checks
            else
              echo "$registry_result" >&2
              exit "$registry_status"
            fi
          done
